<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matemática 1° Básico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<meta name="description" content="Juego para practicar Matemática de 1° básico: números hasta 100, decenas y unidades, problemas, medición y pictogramas.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E3229" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mate 1°">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top"><div class="top-in">
  <button class="brand" id="homeBtn" aria-label="Ir al mapa"><b>Matemática <span>1° básico</span></b></button>
  <div class="spacer"></div>
  <span class="pill" title="Estrellas ganadas"><span class="star">★</span><span id="totalStars">0</span></span>
  <button class="pill" id="voiceBtn" aria-pressed="true" title="Leer en voz alta"><span aria-hidden="true">🔊</span><span class="lbl">Voz</span></button>
  <button class="pill" id="soundBtn" aria-pressed="true" title="Sonidos"><span aria-hidden="true">🎵</span><span class="lbl">Sonido</span></button>
</div></header>
<main id="app"></main>

<script src="app.js" defer></script>
</body>
</html>
